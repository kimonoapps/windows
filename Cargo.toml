[workspace]
resolver = "3"
members = ["crates/core", "crates/drive", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/kimonoapps/windows"

[workspace.dependencies]
kimono-core = { path = "crates/core" }
kimono-drive = { path = "crates/drive" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream", "cookies", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
